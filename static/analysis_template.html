<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5; color: #333; line-height: 1.8;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; padding: 48px 24px; text-align: center; border-radius: 16px; margin-bottom: 32px;
  }
  .header h1 { font-size: 28px; margin-bottom: 12px; font-weight: 700; }
  .header .meta { font-size: 14px; opacity: 0.85; }
  .card {
    background: #fff; border-radius: 12px; padding: 32px; margin-bottom: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .card h2 { font-size: 22px; color: #667eea; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #667eea20; }
  .card h3 { font-size: 18px; color: #764ba2; margin: 20px 0 12px; }
  .card p { margin-bottom: 12px; }
  .card ul, .card ol { padding-left: 24px; margin-bottom: 12px; }
  .card li { margin-bottom: 6px; }
  .card blockquote {
    border-left: 4px solid #667eea; padding: 8px 16px; margin: 16px 0;
    background: #f8f9ff; border-radius: 0 8px 8px 0; color: #555;
  }
  .card code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin-right: 8px;
  }
  .badge-purple { background: #764ba220; color: #764ba2; }
  .badge-blue { background: #667eea20; color: #667eea; }
  .footer {
    text-align: center; padding: 24px; color: #999; font-size: 13px;
    border-top: 1px solid #eee; margin-top: 40px;
  }
  @media (max-width: 600px) {
    .container { padding: 20px 16px; }
    .header { padding: 32px 16px; }
    .header h1 { font-size: 22px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <span class="badge badge-purple">{{LANGUAGE}}</span>
      <span class="badge badge-blue">{{DATE}}</span>
    </div>
  </div>
  {{CONTENT}}
  <div class="footer">
    Generated by Content Analysis Agent &middot; {{DATE}}
  </div>
</div>
</body>
</html>
